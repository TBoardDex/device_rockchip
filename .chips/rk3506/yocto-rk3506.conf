# RK3506 Yocto rootfs: boot from UBI-backed SquashFS and provide a console.

include include/common.conf

MACHINE = "rockchip-rk3506-evb"
RK_ROOTFS_TYPE = "squashfs-zst"
IMAGE_FSTYPES:remove = "wic"
PSEUDO_IGNORE_PATHS .= ",${TOPDIR}/../../kernel,${TOPDIR}/../../kernel-6.12"

DISTRO_FEATURES:remove = "alsa bluetooth opengl pulseaudio vulkan wayland wifi x11"
MACHINE_FEATURES:remove = "alsa bluetooth gpu screen touchscreen usbhost usbgadget wifi"
IMAGE_INSTALL:append = " iw wpa-supplicant bluez5 net-tools mtd-utils-ubifs"
EXTRA_IMAGE_FEATURES = ""
# Keep an interactive console login for development images: user root, empty password.
IMAGE_FEATURES = "empty-root-password read-only-rootfs"
CORE_IMAGE_EXTRA_INSTALL = ""
